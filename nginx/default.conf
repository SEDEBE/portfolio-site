server {
    listen 80;
    root /usr/share/nginx/html;

    # Built files have a hash in their name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images, video and the CV keep their names: cache them for a week, revalidating after that.
    location ~* \.(webp|png|jpg|svg|webm|pdf)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json application/xml;
}
